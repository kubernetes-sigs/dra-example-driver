# Scaling example: 2 secondary NICs (1 VLAN underlay + 1 OVN overlay)
# on a single netshoot pod. Run one example at a time (they share subnets).
# GENERATED by examples/generate.py.
#   kubectl apply -f this-file        (or: make nic-example-deploy COUNT=2)
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: pod-nic-2
  namespace: default
spec:
  devices:
    requests:
      - name: nic0
        exactly:
          deviceClassName: nic.kubeovn.io
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'vlan100-subnet'"
          count: 1
      - name: nic1
        exactly:
          deviceClassName: nic.kubeovn.io
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'ovn-subnet'"
          count: 1
    config:
      - requests: ["nic0"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net1
      - requests: ["nic1"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net2
---
apiVersion: v1
kind: Pod
metadata:
  name: nic-demo-2
  namespace: default
spec:
  resourceClaims:
    - name: nics
      resourceClaimName: pod-nic-2
  containers:
    - name: demo
      image: nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: nics
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
