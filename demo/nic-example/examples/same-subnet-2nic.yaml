# Two secondary NICs of ONE pod on the SAME kube-ovn Subnet (ovn-subnet, OVN
# overlay — no containerlab needed), from two claims.
#
# kube-ovn keys a NIC by its subnet's provider. When several NICs of a pod share
# the provider, kube-ovn-controller keys each by "<provider>.<interfaceName>",
# the same rule it uses for repeated Multus attachments of one
# NetworkAttachmentDefinition, so each NIC gets its own address and logical
# switch port.
#
#   kubectl apply -f demo/nic-example/examples/same-subnet-2nic.yaml
#   kubectl exec same-subnet-2nic -- ip -br addr
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: same-subnet-net1
  namespace: default
spec:
  devices:
    requests:
      - name: nic
        exactly:
          deviceClassName: nic.kubeovn.io
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'ovn-subnet'"
          count: 1
    config:
      - requests: ["nic"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net1
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: same-subnet-net2
  namespace: default
spec:
  devices:
    requests:
      - name: nic
        exactly:
          deviceClassName: nic.kubeovn.io
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'ovn-subnet'"
          count: 1
    config:
      - requests: ["nic"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net2
---
apiVersion: v1
kind: Pod
metadata:
  name: same-subnet-2nic
  namespace: default
spec:
  resourceClaims:
    - name: net1
      resourceClaimName: same-subnet-net1
    - name: net2
      resourceClaimName: same-subnet-net2
  containers:
    - name: demo
      image: nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: net1
          - name: net2
