# Shared-subnet connectivity test fixture: 4 peers, ALL
# allocating from the SAME overlay subnet (ovn-subnet), not one
# subnet each (contrast with 07-vlan-peer-pod.yaml, where VLAN underlay
# needs a dedicated subnet per peer). Demonstrates a Subnet's shared IP
# pool / AllowMultipleAllocations — see examples/shared-subnet.yaml for
# the minimal 2-pod version of the same property.
#
# ONE ResourceClaimTemplate (ovn-peer-nic-template) shared by every peer pod —
# same pattern as the VMI examples (e.g. 00-resourceclaimtemplate.yaml),
# not a dedicated ResourceClaim per pod: every peer requests the
# identical (subnet, interfaceName), so kubelet stamping out a fresh
# claim per pod from one template is both correct and less to manage.
# GENERATED by examples/generate.py.
#   ovn<N>-peer  net1 on ovn-subnet, split control-plane/worker
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: ovn-peer-nic-template
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: net0
          exactly:
            deviceClassName: nic.kubeovn.io
            selectors:
              - cel:
                  expression: "device.attributes['nic.kubeovn.io'].subnetName == 'ovn-subnet'"
            count: 1
      config:
        - requests: ["net0"]
          opaque:
            driver: nic.kubeovn.io
            parameters:
              apiVersion: nic.resource.kube-ovn.io/v1alpha1
              kind: NicConfig
              interfaceName: net1
---
apiVersion: v1
kind: Pod
metadata:
  name: ovn1-peer
  namespace: default
  labels:
    app: ovn-peer-test
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resourceClaims:
    - name: nics
      resourceClaimTemplateName: ovn-peer-nic-template
  containers:
    - name: peer
      image: nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: nics
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
---
