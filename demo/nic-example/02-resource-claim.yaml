# ResourceClaim for the demo pod (03-pod.yaml): ONE underlay + ONE overlay NIC:
#   nic0 -> vlan100-subnet (VLAN 100 underlay, 172.23.0.0/24)  -> net1
#   nic1 -> ovn-subnet     (OVN overlay,        10.200.0.0/24) -> net2
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: pod-multi-nic
  namespace: default
spec:
  devices:
    requests:
      - name: nic0
        exactly:
          deviceClassName: nic.kubeovn.io
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'vlan100-subnet'"
          count: 1
      - name: nic1
        exactly:
          deviceClassName: nic.kubeovn.io
          selectors:
            - cel:
                expression: "device.attributes['nic.kubeovn.io'].subnetName == 'ovn-subnet'"
          count: 1
    config:
      - requests: ["nic0"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net1
      - requests: ["nic1"]
        opaque:
          driver: nic.kubeovn.io
          parameters:
            apiVersion: nic.resource.kube-ovn.io/v1alpha1
            kind: NicConfig
            interfaceName: net2
