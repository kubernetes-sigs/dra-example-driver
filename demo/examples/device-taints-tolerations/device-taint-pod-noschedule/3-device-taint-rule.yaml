apiVersion: resource.k8s.io/v1
kind: DeviceTaintRule
metadata:
  name: example
spec:
  # New device allocations require a matching toleration.
  # Pods already using these devices keep running.
  deviceSelector:
    driver: gpu.example.com
  taint:
    key: gpu.example.com/unhealthy
    value: "true"
    effect: NoSchedule