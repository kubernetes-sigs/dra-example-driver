apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: example
spec:
  deviceSelector:
    driver: gpu.dra-example-driver.sigs.k8s.io
  taint:
    key: gpu.dra-example-driver.sigs.k8s.io/unhealthy
    value: "true"
    # Evict any already-running pods that do not tolerate the device taint.
    effect: NoExecute