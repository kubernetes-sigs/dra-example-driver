name: Run e2e tests

# Manual only: the e2e suite stands up a full kind + kube-ovn (DRA fork image) +
# driver stack, which is heavy and depends on the published
# docker.io/soer3n/kube-ovn:dra-driver-<version> image. Trigger from the Actions
# tab when you want to validate end-to-end. The VLAN-underlay (containerlab)
# specs are not run here (they need sudo + containerlab); run those locally with
# E2E_CONTAINERLAB=1.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.25.5
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: install helm and kubectl
      run: |
        sudo snap install helm --classic
        sudo snap install kubectl --classic
    - name: install kind
      # The release that ships the Makefile's kindest/node v1.35 image.
      run: go install sigs.k8s.io/kind@v0.33.0
    - name: Setup e2e
      run: make setup-e2e
    - name: Run e2e tests
      run: make test-e2e
    - name: Teardown e2e
      if: always()
      run: make teardown-e2e
