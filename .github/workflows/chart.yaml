name: Helm chart

# Lints the chart on every push and pull request, and pushes it as an OCI
# artifact to oci://registry-1.docker.io/soer3n on chart/<version> tags.
# Pushing needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    branches: [ main ]
    tags: [ 'chart/*' ]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
    - name: Lint
      run: |
        helm lint deployments/helm/kube-ovn-dra-driver --namespace kube-system
        helm template kube-ovn-dra-driver deployments/helm/kube-ovn-dra-driver --namespace kube-system --kube-version 1.35.0 > /dev/null
    - name: Log in to Docker Hub
      if: startsWith(github.ref, 'refs/tags/chart/')
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
    - name: Push
      if: startsWith(github.ref, 'refs/tags/chart/')
      run: make push-chart CHART_GIT_TAG="${GITHUB_REF_NAME}" HELM=helm
