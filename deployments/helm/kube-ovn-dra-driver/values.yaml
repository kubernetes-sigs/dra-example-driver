# Default values for kube-ovn-dra-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The chart is published as kube-ovn-dra-driver-chart, next to the image
# kube-ovn-dra-driver; resources keep the name kube-ovn-dra-driver.
nameOverride: "kube-ovn-dra-driver"
fullnameOverride: ""
namespaceOverride: ""
selectorLabelsOverride: {}

allowDefaultNamespace: false

# deviceProfile describes the overall shape of the devices managed by the
# driver. Available profiles are:
#   - "nic": kube-ovn virtual NICs published per node from kube-ovn Subnets.
deviceProfile: "nic"

# driverName uniquely identifies the driver within the cluster. When empty, its
# value is derived from the deviceProfile (e.g. "nic.kubeovn.io").
driverName: ""

imagePullSecrets: []
image:
  repository: docker.io/soer3n/kube-ovn-dra-driver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

kubeletPlugin:
  priorityClassName: "system-node-critical"
  updateStrategy:
    type: RollingUpdate
    # The kubeletplugin runs with hostNetwork and a fixed healthcheck port
    # (51515), so it cannot surge: a new pod started before the old one is
    # killed can never bind that port and crash-loops forever, hanging the
    # rollout. maxUnavailable must do the work instead.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  # nicAttach configures the NIC attach datapath (NRI hook + OVS). The plugin
  # pod runs privileged with host network/PID and mounts the host OVS run dir,
  # so it can create veth pairs, enter pod netns and run ovs-vsctl. The image
  # must ship ovs-vsctl (the Dockerfile's default stage does).
  nicAttach:
    ovsRunDir: /var/run/openvswitch
    # Host directory holding pod network namespaces (CNI bind-mounts them here as
    # cni-<id>). Mounted with HostToContainer propagation so the NRI hook can
    # open the pod netns by path.
    netnsDir: /var/run/netns
  containers:
    init:
      securityContext: {}
      resources: {}
    plugin:
      resources: {}
      # Port running a gRPC health service checked by a livenessProbe.
      # Set to a negative value to disable the service and the probe.
      healthcheckPort: 51515

webhook:
  enabled: false
  servicePort: 443
  containerPort: 443
  priorityClassName: "system-cluster-critical"
  strategy:
    type: RollingUpdate
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  containers:
    webhook:
      securityContext:
        privileged: false
      resources: {}
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
