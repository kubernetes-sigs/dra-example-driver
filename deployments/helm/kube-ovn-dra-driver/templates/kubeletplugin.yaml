---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kube-ovn-dra-driver.fullname" . }}-kubeletplugin
  namespace: {{ include "kube-ovn-dra-driver.namespace" . }}
  labels:
    {{- include "kube-ovn-dra-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubeletplugin
spec:
  selector:
    matchLabels:
      {{- include "kube-ovn-dra-driver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kubeletplugin
  {{- with .Values.kubeletPlugin.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.kubeletPlugin.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kube-ovn-dra-driver.templateLabels" . | nindent 8 }}
        app.kubernetes.io/component: kubeletplugin
    spec:
      # The NIC attach datapath needs host network/PID to enter pod netns and
      # reach the host OVS socket.
      hostNetwork: true
      hostPID: true
      {{- if .Values.kubeletPlugin.priorityClassName }}
      priorityClassName: {{ .Values.kubeletPlugin.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kube-ovn-dra-driver.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.kubeletPlugin.podSecurityContext | nindent 8 }}
      initContainers:
      - name: init-plugin-dir
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command:
          - sh
          - -c
          - |
            mkdir -p {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath }}/{{ include "kube-ovn-dra-driver.driverName" . }} && \
            chmod 0750 {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath }}/{{ include "kube-ovn-dra-driver.driverName" . }}
        volumeMounts:
        - name: plugins
          mountPath: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath }}
      containers:
      - name: plugin
        securityContext:
          # Required to create veth pairs, enter pod netns, and manage OVS.
          privileged: true
          runAsUser: 0
        image: {{ include "kube-ovn-dra-driver.fullimage" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/kube-ovn-dra-kubeletplugin"]
        resources:
          {{- toYaml .Values.kubeletPlugin.containers.plugin.resources | nindent 10 }}
        {{/*
          A literal "0" will allocate a random port. Don't configure the probe
          with the same literal "0" since that won't match where the service is
          actually running.
        */}}
        {{- if (gt (int .Values.kubeletPlugin.containers.plugin.healthcheckPort) 0) }}
        livenessProbe:
          grpc:
            port: {{ .Values.kubeletPlugin.containers.plugin.healthcheckPort }}
            service: liveness
          failureThreshold: 3
          periodSeconds: 10
        {{- end }}
        env:
        - name: DRIVER_NAME
          value: {{ include "kube-ovn-dra-driver.driverName" . | quote }}
        - name: DEVICE_PROFILE
          value: {{ .Values.deviceProfile | quote }}
        - name: CDI_ROOT
          value: /var/run/cdi
        - name: KUBELET_REGISTRAR_DIRECTORY_PATH
          value: {{ .Values.kubeletPlugin.kubeletRegistrarDirectoryPath }}
        - name: KUBELET_PLUGINS_DIRECTORY_PATH
          value: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.kubeletPlugin.containers.plugin.healthcheckPort }}
        - name: HEALTHCHECK_PORT
          value: {{ .Values.kubeletPlugin.containers.plugin.healthcheckPort | quote }}
        {{- end }}
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        volumeMounts:
        - name: plugins-registry
          mountPath: {{ .Values.kubeletPlugin.kubeletRegistrarDirectoryPath }}
        - name: plugins
          mountPath: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath }}
        - name: cdi
          mountPath: /var/run/cdi
        - name: nri
          mountPath: /var/run/nri
        - name: ovs-run
          mountPath: {{ .Values.kubeletPlugin.nicAttach.ovsRunDir }}
        # The NRI hook opens the pod netns by path (e.g. /var/run/netns/cni-<id>).
        # CNI bind-mounts those netns files after the plugin has started, so
        # HostToContainer propagation is required for them to become visible.
        - name: netns
          mountPath: {{ .Values.kubeletPlugin.nicAttach.netnsDir }}
          mountPropagation: HostToContainer
      volumes:
      - name: plugins-registry
        hostPath:
          path: {{ .Values.kubeletPlugin.kubeletRegistrarDirectoryPath }}
      - name: plugins
        hostPath:
          path: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath }}
      - name: cdi
        hostPath:
          path: /var/run/cdi
      - name: nri
        hostPath:
          path: /var/run/nri
      - name: ovs-run
        hostPath:
          path: {{ .Values.kubeletPlugin.nicAttach.ovsRunDir }}
      - name: netns
        hostPath:
          path: {{ .Values.kubeletPlugin.nicAttach.netnsDir }}
          type: DirectoryOrCreate
      {{- with .Values.kubeletPlugin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeletPlugin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeletPlugin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
