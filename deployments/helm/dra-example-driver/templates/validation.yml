{{/* POD_UID comes from the Pod metadata. Reserve 36 bytes for its UUID. */}}
{{- $driverName := include "dra-example-driver.driverName" . }}
{{- $socketPath := printf "%s/%s/dra-00000000-0000-0000-0000-000000000000.sock" .Values.kubeletPlugin.kubeletPluginsDirectoryPath $driverName | clean }}
{{- if gt (len $socketPath) 107 }}
{{- fail (printf "DRA socket path is %d bytes; Linux permits at most 107 bytes. Shorten driverName or kubeletPlugin.kubeletPluginsDirectoryPath." (len $socketPath)) }}
{{- end }}

{{- if .Values.namespace }}
{{- $error := "" }}
{{- $error = printf "%s\nValue 'namespace' set to %s" $error .Values.namespace }}
{{- $error = printf "%s\nSetting an explicit 'namespace' in values.yaml or via --set on the command line is no longer supported." $error }}
{{- $error = printf "%s\nUse --namespace (with --create-namespace as necessary) instead." $error }}
{{- $error = printf "%s\nSee: https://helm.sh/docs/helm/helm_install/#options" $error }}
{{- fail $error }}
{{- end }}

{{- if and (eq (include "dra-example-driver.namespace" .) "default") ( eq .Values.namespaceOverride "") (not .Values.allowDefaultNamespace) }}
{{- $error := "" }}
{{- $error = printf "%s\nRunning in the 'default' namespace is not recommended." $error }}
{{- $error = printf "%s\nSet 'allowDefaultNamespace=true' to bypass this error." $error }}
{{- $error = printf "%s\nOtherwise, use --namespace (with --create-namespace as necessary) to run in a specific namespace." $error }}
{{- $error = printf "%s\nSee: https://helm.sh/docs/helm/helm_install/#options" $error }}
{{- fail $error }}
{{- end }}
